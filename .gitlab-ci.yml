# GitLab CI for apollo — assumes a Docker executor.
#
# Pipeline: compile (JVM) → test (JVM) → integration (Docker-in-Docker +
# docker compose) → native (auto; needs the LLVM + OpenSSL + liburing toolchain).
#
# Notes
#  * The image is on the sbtscala sbt-2.x line; its launcher runs the sbt 2.0.8
#    pinned in project/build.properties. `_2.x` is a rolling tag — swap the
#    JDK/sbt coordinates for any published `sbtscala/scala-sbt` tag if this one
#    is ever unavailable (see hub.docker.com/r/sbtscala/scala-sbt).
#  * JDK 25+ is REQUIRED, not just recommended: kyo 1.0.0-RC6's macro artifacts
#    are compiled for Java 25 (class file version 69) and macros run at COMPILE
#    time, so JDK 21 dies with UnsupportedClassVersionError. Hence temurin-25.
#  * `agentJVM/test` maps to testQuick (skips unchanged suites), so the test jobs
#    use `testOnly *` to force a full run.
#  * Every test job asserts a NON-ZERO test count. sbt 2's ActionCache can serve
#    an empty `Test/compile` output, which links a test binary containing no test
#    classes: the run then prints `Passed: Total 0, Failed 0` and `[success]` and
#    looks green while having executed nothing. That was the real state of the
#    Native suite locally in Sept 2026, so the guard is not theoretical.
#  * The native job is memory-hungry (.jvmopts sets -Xmx8G); it runs on every
#    pipeline as a hard gate, so a Native-only regression fails CI. It needs
#    liburing-dev on the runner (kyo-net's io_uring backend links -luring). It
#    links the binary AND runs the Native suite in one sbt invocation so both
#    share a single compile.

stages:
  - build
  - test
  - integration
  - native

variables:
  # Keep sbt/coursier caches inside the project dir so GitLab can cache them.
  COURSIER_CACHE: "$CI_PROJECT_DIR/.cache/coursier"
  SBT_OPTS: >-
    -Dsbt.boot.directory=$CI_PROJECT_DIR/.sbt/boot
    -Dsbt.global.base=$CI_PROJECT_DIR/.sbt/global
    -Dsbt.ivy.home=$CI_PROJECT_DIR/.ivy2
    -Dsbt.color=true

# Run once per branch/MR/tag, and don't double-run a branch that has an open MR.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS == null'
    - if: '$CI_COMMIT_TAG'

# --- JVM jobs -----------------------------------------------------------------

.sbt:
  image: sbtscala/scala-sbt:eclipse-temurin-25.0.4_7_2.x
  cache:
    # GitLab allows at most 2 files in cache:key:files. build.sbt (library deps)
    # and plugins.sbt (sbt plugins) are what meaningfully invalidate the caches.
    key:
      files:
        - build.sbt
        - project/plugins.sbt
    paths:
      - .cache/coursier/
      - .ivy2/
      - .sbt/

compile:
  extends: .sbt
  stage: build
  script:
    - sbt agentJVM/compile

test:jvm:
  extends: .sbt
  stage: test
  needs: ["compile"]
  script:
    # Bare `test` == testQuick; `testOnly *` forces the whole suite to run.
    - sbt "agentJVM/testOnly *" 2>&1 | tee jvm-test.log
    # tee masks sbt's exit code, so the guard asserts on the log instead - sbt
    # must have succeeded AND run a non-zero number of tests (see header note).
    - ci/assert-tests-ran.sh jvm-test.log

# --- integration: docker compose under Docker-in-Docker -----------------------

integration:compose:
  stage: integration
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_TLS_VERIFY: "1"
  before_script:
    - docker info
    - docker compose version   # fails fast if the compose plugin is missing
  script:
    - docker compose up -d
    - docker compose ps
    # Prove the stack is reachable — the shape a docker-backed integration
    # test (e.g. apollo's `terminal.backend: docker`) would build on.
    - docker compose exec -T sandbox sh -c 'echo "hello from docker compose under dind"'
  after_script:
    - docker compose down -v || true

# --- native binary (heavy toolchain) ------------------------------------------

native:link-and-test:
  extends: .sbt
  stage: native
  # A hard parity gate: the Native binary is built and linked on every pipeline,
  # so a Native-only break (io_uring/OpenSSL linkage, a non-portable API) fails
  # CI instead of surfacing later. It also runs the Native test suite — linking
  # alone proves the code compiles and links, not that it behaves, and Native is
  # a first-class target. Both commands run in one sbt invocation so the Native
  # compile is paid once. Memory-hungry (.jvmopts sets -Xmx8G).
  before_script:
    # Throttle the build for CI only; the working copy is a throwaway clone and
    # local dev keeps .jvmopts as it is. The Native link kept killing the host
    # in codegen - the phase after "Optimizing (debug mode)" where Scala Native
    # compiles the LLVM IR files - taking sbt down with it ("sbt server
    # disconnected", jobs 1091/1095) or freezing the runner until GitLab failed
    # the job with no_updates_running (job 1077).
    #
    # The Native workload is NOT what regressed: against the last green run
    # (job 498) this link discovers 25091 vs 25092 classes and 51779 vs 51783
    # methods after optimization. It is the runner's memory.
    #
    #  * -Xmx2G     - .jvmopts asks for 8G, which suits a dev machine, not this
    #                 host. Measured on the runner (job 1106): 11Gi RAM with
    #                 6.7Gi ALREADY in use and 3.2Gi of the 3.8Gi swap consumed
    #                 before the build starts, leaving ~4.9Gi available. At the
    #                 failure swap was at 3.8Gi/3.8Gi - fully exhausted - so the
    #                 OOM killer takes the sbt server. 4G left no room for clang
    #                 on top; 2G plus two clangs fits what is actually free.
    #                 Disk is NOT a factor: 32G free, and flat across the build.
    #  * ActiveProcessorCount - the actual fix. Build$ sizes its compile pool
    #                 with Executors.newFixedThreadPool(availableProcessors),
    #                 one clang per IR file, so on a many-core host ~151 files
    #                 fan out far past what the RAM can back. NativeConfig
    #                 exposes no parallelism knob in 0.5.12, but capping the
    #                 JVM's view of the CPU count caps the pool. Slower codegen
    #                 (27s at full width in job 498), which CI can afford.
    - printf '%s\n' "-Xmx2G" "-XX:ActiveProcessorCount=2" > .jvmopts
    # TEMPORARY DIAGNOSTICS - remove once the native failure is understood.
    # Two throttling attempts (heap, then codegen parallelism) did not fix it,
    # so stop inferring and measure. Printing disk as well as memory: the
    # caches and target dirs grow every pipeline, which fits a failure that
    # appeared between two builds of near-identical size and gets worse over
    # time. Also dumps the sbt server's real JVM args, since sbt 2 starts the
    # server as a SEPARATE background process and it is unverified that
    # .jvmopts above reaches it at all.
    - echo "=== nproc ==="; nproc
    - echo "=== free ==="; free -h || true
    - echo "=== df ==="; df -h / /builds || true
    - echo "=== cgroup limits ==="; cat /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.high 2>/dev/null || cat /sys/fs/cgroup/memory/memory.limit_in_bytes 2>/dev/null || true
    - echo "=== .jvmopts ==="; cat .jvmopts
    # Scala Native links a C/LLVM toolchain plus three native libraries:
    #  * libssl-dev     — kyo-http's OpenSSL 3 TLS shim.
    #  * liburing-dev   — kyo-net statically links -luring (-Wl,-Bstatic -luring)
    #    for its Linux io_uring backend, and its C shim #includes <liburing.h>.
    #    Without the dev package the shim compiles to an empty translation unit
    #    and every kyo_uring_*/io_uring_* symbol is undefined at link time.
    #  * libstdc++-11-dev — boringssl's whole-archive pulls in -lstdc++.
    - apt-get update -qq
    - apt-get install -y -qq clang llvm libstdc++-11-dev zlib1g-dev libssl-dev liburing-dev
  script:
    # One quoted string with `;` — sbt 2.0.8 CONCATENATES separate argument
    # strings into a single command line instead of running them in sequence,
    # so `sbt cmd1 "cmd2"` would silently never run cmd2.
    # TEMPORARY: report the sbt server's actual JVM args, and the disk/memory
    # state after the build, whether or not it survived.
    - (sleep 45; echo "=== sbt server JVM args ==="; ps -eo rss,args 2>/dev/null | grep -i "[s]bt\|[j]ava" | head -5) &
    - sbt "agentNative/nativeLink; agentNative/testOnly *" 2>&1 | tee native-test.log || { echo "=== post-mortem df ==="; df -h / /builds; echo "=== post-mortem free ==="; free -h; exit 1; }
    # tee masks sbt's exit code, so the guard asserts on the log instead. A
    # vacuous Native run reports "Total 0" and still exits green - see header.
    - ci/assert-tests-ran.sh native-test.log
  artifacts:
    paths:
      - target/out/native0.5/scala-3.9.0/apollo/apollo
    expire_in: 1 week
