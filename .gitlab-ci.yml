# GitLab CI for apollo — assumes a Docker executor.
#
# This pipeline and .github/workflows/ci.yml are the SAME pipeline on two
# forges: every job's work lives in a ci/*.sh script that both call, inside the
# same container images. Change a script, not a job, and keep the two YAML
# files in step when adding or removing a job.
#
# Pipeline: license (REUSE) + README sync → compile (JVM) → test (JVM +
# coverage) → integration (Docker-in-Docker + docker compose) → native (link +
# test) → on main: coverage report → on a v* tag: package (assembly jar) →
# release (jar + native binary).
#
# The coverage report is the one deliberate difference between the forges:
# each publishes where its own badge links (GitLab: a wiki page, since this
# instance has no Pages; GitHub: the HTML report on GitHub Pages).
#
# Notes
#  * The image is on the sbtscala sbt-2.x line; its launcher runs the sbt 2.0.8
#    pinned in project/build.properties. `_2.x` is a rolling tag — swap the
#    JDK/sbt coordinates for any published `sbtscala/scala-sbt` tag if this one
#    is ever unavailable (see hub.docker.com/r/sbtscala/scala-sbt).
#  * JDK 25+ is REQUIRED, not just recommended: kyo 1.0.0-RC6's macro artifacts
#    are compiled for Java 25 (class file version 69) and macros run at COMPILE
#    time, so JDK 21 dies with UnsupportedClassVersionError. Hence temurin-25.
#  * Every test job asserts a NON-ZERO test count (ci/assert-tests-ran.sh). sbt
#    2's ActionCache can serve an empty `Test/compile` output, which links a
#    test binary containing no test classes: the run then prints `Passed: Total
#    0, Failed 0` and `[success]` and looks green while having executed
#    nothing. That was the real state of the Native suite locally in Sept 2026,
#    so the guard is not theoretical.
#  * The native job is a hard gate on every pipeline, so a Native-only
#    regression fails CI.

stages:
  - lint
  - build
  - test
  - integration
  - native
  - publish
  - package
  - release

variables:
  # Keep sbt/coursier caches inside the project dir so GitLab can cache them.
  COURSIER_CACHE: "$CI_PROJECT_DIR/.cache/coursier"
  SBT_OPTS: >-
    -Dsbt.boot.directory=$CI_PROJECT_DIR/.sbt/boot
    -Dsbt.global.base=$CI_PROJECT_DIR/.sbt/global
    -Dsbt.ivy.home=$CI_PROJECT_DIR/.ivy2
    -Dsbt.color=true
  # The runner's DNS intermittently fails to resolve the GitLab host, and the
  # clone dies with "Could not resolve host ... (Timeout while contacting DNS
  # servers)" before any script runs (pipelines 392, 393, 394). GitLab reports
  # that as script_failure - the same class as a failing test - so `retry:when`
  # cannot tell the two apart. These make the *runner* retry the fetch itself,
  # which is exactly the step that fails and nothing else. A mitigation; the fix
  # is on the runner host.
  GET_SOURCES_ATTEMPTS: "3"
  RESTORE_CACHE_ATTEMPTS: "3"
  ARTIFACT_DOWNLOAD_ATTEMPTS: "3"

# Run once per branch/MR/tag, and don't double-run a branch that has an open MR.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS == null'
    - if: '$CI_COMMIT_TAG'

.release-tag:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+.*$/'

# --- licensing ----------------------------------------------------------------

# Every file must carry an SPDX header or be covered by REUSE.toml.
license:reuse:
  stage: lint
  image:
    name: fsfe/reuse:latest
    entrypoint: [""]
  script:
    - reuse lint

# The two READMEs are generated from one body (ci/readme-sync.sh); drift is
# invisible until somebody reads the wrong one.
readme-sync:
  stage: lint
  image: debian:bookworm-slim
  script:
    - ci/readme-sync.sh --check

# --- JVM jobs -----------------------------------------------------------------

.sbt:
  image: sbtscala/scala-sbt:eclipse-temurin-25.0.4_7_2.x
  cache:
    # GitLab allows at most 2 files in cache:key:files. build.sbt (library deps)
    # and plugins.sbt (sbt plugins) are what meaningfully invalidate the caches.
    key:
      files:
        - build.sbt
        - project/plugins.sbt
    paths:
      - .cache/coursier/
      - .ivy2/
      - .sbt/

compile:
  extends: .sbt
  stage: build
  script:
    - sbt agentJVM/compile

test:jvm:
  extends: .sbt
  stage: test
  needs: ["compile"]
  script:
    - ci/test-jvm.sh
  # Drives the project's coverage badge (badges/<branch>/coverage.svg).
  coverage: '/^Coverage: (\d+\.\d+)%/'
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - coverage/
      - jvm-test.log
    reports:
      junit: test-reports/*.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura.xml

# --- integration: docker compose under Docker-in-Docker -----------------------

integration:compose:
  stage: integration
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_TLS_VERIFY: "1"
  script:
    - ci/integration.sh

# --- native binary (heavy toolchain) ------------------------------------------

native:link-and-test:
  extends: .sbt
  stage: native
  variables:
    # Throttle the build for this runner only; local dev keeps .jvmopts as it
    # is. The Native link kept killing the host in codegen - the phase after
    # "Optimizing (debug mode)" where Scala Native compiles the LLVM IR files -
    # taking sbt down with it ("sbt server disconnected", jobs 1091/1095) or
    # freezing the runner until GitLab failed the job with no_updates_running
    # (job 1077).
    #
    # The Native workload is NOT what regressed: against the last green run
    # (job 498) this link discovers 25091 vs 25092 classes and 51779 vs 51783
    # methods after optimization. It is the runner's memory.
    #
    #  * -Xmx3G     - .jvmopts asks for 8G, which suits a dev machine, not this
    #                 host. Measured on the runner (job 1106): 11Gi RAM with
    #                 6.7Gi ALREADY in use and 3.2Gi of the 3.8Gi swap consumed
    #                 before the build starts, leaving ~4.9Gi available.
    #                 The usable heap is bracketed from BOTH sides:
    #                   8G/4G - the kernel OOM-kills the sbt server mid-link
    #                           ("sbt server disconnected", swap at 3.8/3.8Gi).
    #                   2G    - the JVM dies on its own heap instead
    #                           (OutOfMemoryError: Java heap space, job 1110).
    #                 3G sits between them. Disk is NOT a factor: 32G free and
    #                 flat across the build.
    #  * ActiveProcessorCount=1 - the actual fix. Build$ sizes its compile pool
    #                 with Executors.newFixedThreadPool(availableProcessors),
    #                 one clang per IR file, so on a many-core host ~151 files
    #                 fan out far past what the RAM can back. NativeConfig
    #                 exposes no parallelism knob in 0.5.12, but capping the
    #                 JVM's view of the CPU count caps the pool. Slower codegen
    #                 (27s at full width in job 498), which CI can afford.
    NATIVE_JVMOPTS: "-Xmx3G -XX:ActiveProcessorCount=1"
  script:
    - ci/native.sh
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

# --- coverage report (default branch) ----------------------------------------
#
# Where the GitLab coverage badge links. GitHub's counterpart is `coverage-pages`.

coverage-wiki:
  stage: publish
  image: alpine:3.21
  needs: ["test:jvm"]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - apk add --no-cache git python3
    - ci/coverage-wiki.sh
  # A report that cannot be published is not a reason to fail a build; the job
  # still goes red on its own row, with git's own words in the log.
  allow_failure: true
  artifacts:
    when: always
    expire_in: 2 weeks
    paths: [Coverage.md]

# Only where Pages exists: GitLab predefines CI_PAGES_URL when the instance has
# it, so this skips cleanly here and starts publishing by itself the day Pages
# is enabled (then point GITLAB_REPORT in ci/readme-sync.sh at it).
pages:
  stage: publish
  image: debian:bookworm-slim
  needs: ["test:jvm"]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PAGES_URL'
  script:
    - rm -rf public && cp -a coverage/html public
  artifacts:
    paths: [public]
    expire_in: 4 weeks

# --- release (v* tags only) ---------------------------------------------------

package:jvm:
  extends: [.sbt, .release-tag]
  stage: package
  script:
    - ci/package-jvm.sh
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

release:
  extends: .release-tag
  stage: release
  image:
    name: registry.gitlab.com/gitlab-org/cli:latest
    entrypoint: [""]
  needs: ["package:jvm", "native:link-and-test"]
  script:
    - glab auth login --job-token "$CI_JOB_TOKEN" --hostname "$CI_SERVER_HOST" --api-protocol "$CI_SERVER_PROTOCOL"
    - ci/release-notes.sh "$CI_COMMIT_TAG" > release-notes.md
    # Assets go to the project's generic package registry (job tokens may write
    # there) and are linked from the release.
    - glab release create "$CI_COMMIT_TAG" dist/* --name "apollo $CI_COMMIT_TAG" --notes-file release-notes.md --use-package-registry
